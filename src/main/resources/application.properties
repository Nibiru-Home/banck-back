spring.application.name=bank-back

#spring.datasource.url=jdbc:mariadb://mariadb-banco:3306/nibirubank
spring.datasource.url=jdbc:mariadb://localhost:3306/nibirubank
spring.datasource.username=nibiruHome
spring.datasource.password=nibiruHome
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=none

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.port=8081
# CORS local + remoto (se puede sobrescribir con APP_CORS_ALLOWED_ORIGINS)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*,https://localhost:*,https://127.0.0.1:*,https://[::1]:*,http://banck.nibiruhome.store,https://banck.nibiruhome.store,http://bank.nibiruhome.store,https://bank.nibiruhome.store}
server.forward-headers-strategy=framework
